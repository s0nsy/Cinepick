name: CI/CD

on:
  push:
    branches: ["docker"]

jobs:
  compose-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

#      - name: Set up JDK
#        uses: actions/setup-java@v3
#        with:
#          java-version: '17'
#          distribution: 'temurin'

#      - name: Set execute permission for gradlew
#        run: chmod +x ./gradlew

#      - name: Build with Gradle
#        run: ./gradlew clean build --exclude-task test

      - name: Copy jar to cinepick for Docker
        run: |
          mkdir -p cinepick/build/libs
          cp build/libs/*SNAPSHOT.jar ~/cinepick/cinepick.jar

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t cinepick-image .

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          source: "compose.yml"
          target: "~/cinepick"
          overwrite: true

      - name: Run Docker Compose on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            cd ~/cinepick
            docker-compose down
            docker-compose up -d --build
